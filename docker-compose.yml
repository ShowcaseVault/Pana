# Full stack, intended for deployment: datastores plus the application image.
# Local development uses docker-compose.datastores.yml only (see `make up`).
include:
  - docker-compose.datastores.yml

services:
  pana-app:
    image: pana-image
    container_name: pana-app
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - database-pana
      - redis-pana
    networks:
      - pana-network
