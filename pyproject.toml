[project]
name = "pana"
version = "0.0.0"
description = "Pana backend: FastAPI API and Celery workers."
requires-python = ">=3.12"

dependencies = [
    # ---- Web server ----
    "fastapi",
    "uvicorn",
    "python-multipart",

    # ---- Outbound HTTP ----
    "httpx",
    # Runs the blocking google-auth verifier off the event loop.
    "anyio",

    # ---- Database ----
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "psycopg2-binary",

    # ---- Task queue and cache ----
    "celery",
    "redis",
    "cachetools>=7.1.8",

    # ---- Auth ----
    "google-auth[requests]",
    "python-jose",

    # ---- Speech and language ----
    # Groq serves both: Whisper for transcription, chat for the reply.
    "groq",
    # NVIDIA Magpie speech synthesis, over gRPC.
    "nvidia-riva-client>=2.27.0",

    # ---- Telephony ----
    # ARI: REST plus the Stasis events websocket.
    "aiohttp",
    # audioop left the stdlib in 3.13; the backport carries the same API, so
    # the u-law and resampling code in voice_service/audio.py is unchanged.
    "audioop-lts; python_version >= '3.13'",

    # ---- Config ----
    # Reads .env itself; python-dotenv is not needed alongside it.
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", ".venv", "Pana"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports
    "I",   # isort: import ordering
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # FastAPI relies on function calls (Depends) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
# `str, PyEnum` keeps the values JSON-serializable; StrEnum would change behavior.
"api/schemas/transcriptions.py" = ["UP042"]
