[project]
name = "pana"
version = "0.0.0"
description = "Pana backend: FastAPI API and Celery workers."
requires-python = ">=3.12"
dependencies = [
    # Environment
    "python-dotenv",
    "pydantic-settings",
    "langchain",
    "langchain-community",
    "langchain-experimental==0.3.4",
    "langchain-openai==0.3.9",
    # Transcription
    "groq",
    # Server-side
    "fastapi",
    "uvicorn",
    "python-multipart",
    # Database
    "sqlalchemy",
    "psycopg2-binary",
    "asyncpg",
    # Migration
    "alembic",
    # Encryption
    "bcrypt==4.0.0",
    "passlib",
    "python-jose",
    # Authentication
    "google-auth",
    "google-auth-oauthlib",
    # Task Queue
    "celery",
    "redis",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", ".venv", "Pana"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports
    "I",   # isort: import ordering
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI relies on function calls (Depends) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
# SQLAlchemy filters need `col == False`; `not col` would evaluate in Python.
"api/cruds/*.py" = ["E712"]
"api/utils/check_recordings_exist.py" = ["E712"]
# `str, PyEnum` keeps the values JSON-serializable; StrEnum would change behavior.
"api/schemas/transcriptions.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
