[project]
name = "pana"
version = "0.0.0"
description = "Pana backend: FastAPI API and Celery workers."
requires-python = ">=3.12"
dependencies = [
    # Environment
    "python-dotenv",
    "langchain",
    "langchain-community",
    "langchain-experimental==0.3.4",
    "langchain-openai==0.3.9",
    # Transcription
    "groq",
    # Server-side
    "fastapi",
    "uvicorn",
    "python-multipart",
    # Database
    "sqlalchemy",
    "psycopg2-binary",
    "asyncpg",
    # Migration
    "alembic",
    # Encryption
    "bcrypt==4.0.0",
    "passlib",
    "python-jose",
    # Authentication
    "google-auth",
    "google-auth-oauthlib",
    # Task Queue
    "celery",
    "redis",
]

[tool.uv]
package = false
