[directories](!)
astetcdir => /etc/asterisk
; Ubuntu installs modules under the multiarch path, not /usr/lib/asterisk.
; Getting this wrong starts Asterisk with zero modules and no obvious error.
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Never run as root: a remote code execution in Asterisk should not be a root
; shell on the host.
runuser = asterisk
rungroup = asterisk
; Do not load every module found on disk. Fewer modules is a smaller attack
; surface, and it stops chan_sip loading alongside chan_pjsip.
autoload = no
