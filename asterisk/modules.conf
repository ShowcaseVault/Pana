; Module policy.
;
; autoload is ON, with an explicit noload list below. The alternative --
; autoload=no plus an exhaustive load list -- was tried and rejected: Asterisk
; modules have an internal dependency graph that is not documented anywhere in
; the config, so a missing entry does not produce a clear error. It produces
; "declined to load" for the module *and everything downstream of it*, leaving
; Asterisk running with no SIP stack at all. Enumerating what to exclude is a
; far shorter and more reliable list than enumerating what to include.

[modules]
autoload = yes

; --- Channel drivers we do not use -----------------------------------------
; chan_sip is the deprecated SIP stack, superseded by chan_pjsip and a
; recurring source of vulnerabilities. It must never load alongside pjsip:
; both would bind port 5060, and chan_sip's default config is far more
; permissive about anonymous calls.
noload = chan_sip.so
noload = chan_iax2.so
noload = chan_unistim.so
noload = chan_skinny.so
noload = chan_mgcp.so
noload = chan_alsa.so
noload = chan_console.so

; --- Services that open a listener we do not want --------------------------
; The AMI (manager) is a second remote-control channel alongside ARI. One is
; enough, and ARI is the one the media service uses.
noload = res_phoneprov.so
noload = res_pjsip_publish_asterisk.so

; --- Database and provisioning backends we do not use ----------------------
noload = res_config_ldap.so
noload = res_config_odbc.so
noload = res_config_pgsql.so
noload = res_config_sqlite3.so
noload = cdr_mysql.so
noload = cdr_odbc.so
noload = cdr_pgsql.so
