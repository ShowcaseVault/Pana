; Dialplan. Deliberately minimal: this milestone proves the trunk registers
; and that a call can arrive and be answered. The AI conversation is added
; later as a Stasis application, replacing the Playback below.

[general]
static = yes
writeprotect = yes

; MAX_CALL_MS, MAX_CALL_SECONDS and CARRIER_DID are rendered at container
; start from SIP_MAX_CALL_SECONDS and SIP_USERNAME, so the limits change with
; an environment variable rather than an image rebuild.
#include "extensions_globals.conf"

; --- Shared call setup -----------------------------------------------------

[macro-answer-limited]
; Answer with a hard ceiling on the call, then continue in the caller's
; context. Two reasons for the limit: a billable call keeps costing money for
; as long as it is up, and every open call holds a channel and a media session
; on our side. TIMEOUT(absolute) covers the whole call, so a stuck or silent
; channel is torn down rather than living until the far end gives up.
exten => s,1,Set(TIMEOUT(absolute)=${MAX_CALL_SECONDS})
 same => n,NoOp(Call capped at ${MAX_CALL_SECONDS}s)
 same => n,Answer()
 same => n,Return()

; --- Inbound from the carrier ---------------------------------------------
; Only traffic matched by the pjsip `identify` section reaches this context,
; so anything arriving here already claims to be from the carrier.

[from-carrier]
; Answering is what starts the clock on a billable call, so screen before
; answering rather than after. A call to a number that is not our DID is
; rejected while it is still ringing, which costs nothing.
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN})
 same => n,GotoIf($["${EXTEN}" = "${CARRIER_DID}"]?accept)
 same => n,GotoIf($["+${EXTEN}" = "${CARRIER_DID}"]?accept)
 same => n,NoOp(Rejecting call to ${EXTEN}: not our DID (${CARRIER_DID}))
 same => n,Hangup(1)
 same => n(accept),Gosub(macro-answer-limited,s,1)
 same => n,Wait(1)
 ; Placeholder. Becomes: Stasis(pana-voice) once the media service exists.
 ; Playback takes a name without an extension: Asterisk picks the best format
 ; available, which is why the file is shipped as 8 kHz mono WAV.
 same => n,Playback(pana/cid_whistle)
 same => n,Hangup()

; Some carriers deliver the DID in a form that does not match _X. (for example
; a full E.164 with a leading +). Catch anything else rather than dropping it
; silently, so a mismatch shows up in the log instead of as a dead line.
exten => _.,1,NoOp(Inbound call with unmatched extension ${EXTEN})
 same => n,Goto(from-carrier,${EXTEN:1},1)

exten => i,1,NoOp(Invalid extension ${EXTEN})
 same => n,Hangup()

; --- Outbound, used by the AI service via ARI originate --------------------
; Not reachable from the carrier: nothing in from-carrier jumps here.

[to-carrier]
; The same ceiling applies outbound, where we are certainly the paying party.
; Dial's own timeout only bounds ringing, so the absolute limit is set on the
; channel before dialling and survives into the answered call.
exten => _X.,1,NoOp(Outbound call to ${EXTEN}, capped at ${MAX_CALL_SECONDS}s)
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_SECONDS})
 same => n,Dial(PJSIP/${EXTEN}@carrier,60,L(${MAX_CALL_MS}))
 same => n,Hangup()
