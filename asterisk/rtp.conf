[general]
; A narrow, explicitly published RTP range. Every port in this range must be
; forwarded to reach the container, so keep it only as wide as the concurrent
; call count needs: roughly four ports per call is generous.
rtpstart = 20000
rtpend = 20099
; Tear down a call whose audio has stopped, rather than holding the channel
; (and the carrier's billing) open.
rtpchecksums = no
; Discover the public address and port each RTP socket is mapped to, and
; advertise that in the SDP instead of the internal one. Without this Asterisk
; offers its own port (20030, say) while the NAT has mapped that socket to a
; different external port, so the carrier sends audio to a port that is not
; open and the call is one-way. Required here: the connection is behind a NAT
; we do not control and cannot forward ports on. It works because that NAT is
; a cone NAT -- the mapping is stable per source port -- which is what makes
; the discovered port valid for the carrier to send to.
;
; An IPv4 literal, not a hostname: stun.l.google.com resolves to AAAA first
; here, and a STUN reply over IPv6 says nothing about the IPv4 mapping the
; carrier's audio has to traverse. 74.125.250.129 is stun.l.google.com's IPv4
; address.
stunaddr = 74.125.250.129:19302
; Send a keepalive packet every 2 seconds on an otherwise silent stream.
; On a connection behind carrier-grade NAT -- no router access, no way to
; forward a port -- this is what keeps inbound audio working at all: the
; outbound packet creates the NAT mapping the carrier's audio returns
; through, and without it that mapping expires during the silence while
; Asterisk waits for the caller to speak.
rtpkeepalive = 2
