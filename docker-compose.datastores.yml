services:
  # POSTGRES DATABASE SERVICE
  database-pana:
    image: postgres:16
    container_name: database-pana
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_pana_data:/var/lib/postgresql/data
    networks:
      - pana-network

  # CELERY BROKER AND REDIS SERVICE
  redis-pana:
    image: redis:7-alpine
    container_name: redis-pana
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - pana-network

volumes:
  postgres_pana_data:

networks:
  pana-network:
    driver: bridge
